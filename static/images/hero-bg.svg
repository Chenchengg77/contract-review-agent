<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <!-- 渐变背景 -->
  <rect width="1600" height="600" fill="url(#bg)"/>

  <!-- 柔和光斑 -->
  <circle cx="1300" cy="80" r="220" fill="#60a5fa" opacity="0.18"/>
  <circle cx="250" cy="520" r="260" fill="#818cf8" opacity="0.16"/>

  <!-- 合同文档（右侧） -->
  <g transform="translate(1200, 100)">
    <rect x="-40" y="-30" width="300" height="400" rx="14" fill="#ffffff" opacity="0.05" transform="rotate(-4)"/>
    <rect width="300" height="400" rx="14" fill="#ffffff" opacity="0.08"/>
    <rect width="300" height="400" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
    <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round">
      <line x1="40" y1="55" x2="260" y2="55"/>
      <line x1="40" y1="95" x2="220" y2="95"/>
      <line x1="40" y1="135" x2="250" y2="135"/>
      <line x1="40" y1="175" x2="200" y2="175"/>
      <line x1="40" y1="230" x2="260" y2="230"/>
      <line x1="40" y1="270" x2="170" y2="270"/>
    </g>
    <!-- 印章 -->
    <g transform="translate(205, 310)">
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="#dc2626" opacity="0.4"/>
      <rect x="-42" y="-42" width="84" height="84" rx="12" fill="none" stroke="#fca5a5" stroke-width="3"/>
      <text x="0" y="12" text-anchor="middle" font-family="serif" font-size="38" fill="#ffffff" opacity="0.95">审</text>
    </g>
  </g>

  <!-- 放大镜（左下） -->
  <g transform="translate(300, 470)">
    <circle cx="0" cy="0" r="80" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3"/>
    <line x1="56" y1="56" x2="120" y2="120" stroke="#ffffff" stroke-opacity="0.28" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- 散点 -->
  <g fill="#ffffff">
    <circle cx="150" cy="160" r="4" opacity="0.25"/>
    <circle cx="500" cy="120" r="3" opacity="0.2"/>
    <circle cx="720" cy="500" r="5" opacity="0.22"/>
    <circle cx="900" cy="90" r="3" opacity="0.2"/>
    <circle cx="1050" cy="530" r="4" opacity="0.24"/>
    <circle cx="1450" cy="400" r="3" opacity="0.2"/>
  </g>
</svg>
